name: Release quality

on:
  workflow_call:
    inputs:
      release:
        description: Run tag and publication-collision preflight
        required: false
        type: boolean
        default: false
    secrets:
      EXPO_TOKEN:
        required: false
    outputs:
      mobile-version:
        value: ${{ jobs.release-preflight.outputs.mobile-version }}
      stable:
        value: ${{ jobs.release-preflight.outputs.stable }}
      android-previous-version-code:
        value: ${{ jobs.release-preflight.outputs.android-previous-version-code }}
      ios-previous-build-number:
        value: ${{ jobs.release-preflight.outputs.ios-previous-build-number }}
      ios-signing-configured:
        value: ${{ jobs.release-preflight.outputs.ios-signing-configured }}

permissions:
  contents: read

jobs:
  repository-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: stash
          POSTGRES_USER: stash
          POSTGRES_PASSWORD: stash-ci-only
        options: >-
          --health-cmd "pg_isready -U stash -d stash"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run test
      - name: Install PostgreSQL 17 client tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --show-error --silent -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
      - name: Verify shared adapter parity and standalone migration on PostgreSQL 17
        run: node --import tsx --test --test-concurrency=1 tests/instance-store-contract.test.ts tests/embedded-migration.test.ts
        env:
          STASH_TEST_DATABASE_URL: postgresql://stash:stash-ci-only@127.0.0.1:5432/stash
      - name: Verify PostgreSQL account registration transaction
        run: node --import tsx --test tests/postgres-account-registration.test.ts
        env:
          STASH_TEST_DATABASE_URL: postgresql://stash:stash-ci-only@127.0.0.1:5432/stash
      - run: pnpm run build

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Resolve empty-environment configuration
        run: env -i PATH="$PATH" HOME="$HOME" docker compose config
      - name: Start the supported Instance baseline
        run: env -i PATH="$PATH" HOME="$HOME" docker compose up -d --wait
      - name: Verify readiness and the built React application
        run: |
          curl --fail --show-error --retry 5 --retry-connrefused http://127.0.0.1:3000/health/ready
          curl --fail --show-error http://127.0.0.1:3000/ | grep -q Stash
      - name: Verify signup and password authentication
        run: node scripts/compose-auth-outage.mjs register
      - name: Verify database loss stays recoverable and safely diagnosed
        run: |
          docker compose stop postgres
          node scripts/compose-auth-outage.mjs unavailable
          test "$(docker compose ps --status running --services stash)" = "stash"
          logs="$(docker compose logs stash)"
          echo "$logs" | grep -Eq 'Authentication operation unavailable \(operation=password_sign_in, cause=[A-Za-z][A-Za-z0-9]*, code=(unclassified|[A-Z0-9_]{5,32})\)\.'
          if echo "$logs" | grep -Eqi 'secretKey|compose-authentication-smoke-password|postgres://'; then
            echo "Authentication outage logs exposed forbidden protocol or credential material." >&2
            exit 1
          fi
          docker compose start postgres
          node scripts/compose-auth-outage.mjs recovered
      - name: Show container logs after a failure
        if: failure()
        run: docker compose logs
      - name: Stop containers without deleting Instance volumes
        if: always()
        run: docker compose down

  oci-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: stash
          POSTGRES_USER: stash
          POSTGRES_PASSWORD: stash-ci-only
        options: >-
          --health-cmd "pg_isready -U stash -d stash"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build both supported architectures without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=/tmp/stash-image.tar
      - name: Load the runner architecture for runtime smoke testing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: stash-ci:${{ github.sha }}
      - name: Boot and verify the built image
        run: |
          docker run -d --name stash-ci --network host \
            -e DATABASE_URL=postgresql://stash:stash-ci-only@127.0.0.1:5432/stash \
            -e INSTANCE_ADMIN_TOKEN=stash-ci-admin-token \
            -e INSTANCE_MASTER_KEY=c3Rhc2gtY2ktb25seS1tYXN0ZXIta2V5LTAwMDAwMDA= \
            -e PUBLIC_ORIGIN=http://localhost:3000 \
            -e HOST=127.0.0.1 -e PORT=3000 \
            stash-ci:${{ github.sha }}
          for _ in $(seq 1 30); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' stash-ci)" = healthy ] && break
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' stash-ci)" = healthy
          curl --fail --show-error http://127.0.0.1:3000/health/ready
          curl --fail --show-error http://127.0.0.1:3000/ | grep -q Stash
      - if: failure()
        run: docker logs stash-ci
      - if: always()
        run: docker rm -f stash-ci || true

  server-bundle-smoke:
    name: Standalone bundle (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: macos-14
            target: darwin-arm64
          - runner: windows-latest
            target: win32-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap iptables strace
      - name: Enforce no Docker TCP API for the bundle process user
        if: runner.os == 'Linux'
        run: sudo iptables -I OUTPUT -p tcp -m owner --uid-owner "$(id -u)" --dport 2375:2376 -j REJECT
      - name: Remove Windows container executables from the child boundary
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows-bundle-isolation.ps1 Apply
      - name: Package the target-native self-contained Instance
        run: pnpm run package:server
        env:
          STASH_VERSION: ${{ inputs.release && startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.1.0-ci.{0}', github.run_id) }}
          STASH_SOURCE_COMMIT: ${{ github.sha }}
      - name: Smoke the extracted archive without an installed runtime or Docker
        shell: bash
        run: |
          archive="$(find artifacts/server -maxdepth 1 -type f \( -name 'stash-instance-*.tar.gz' -o -name 'stash-instance-*.zip' \) -print -quit)"
          test -n "$archive"
          pnpm run smoke:server-bundle -- --archive "$archive"
      - name: Preserve the exact archives tested by release quality
        uses: actions/upload-artifact@v4
        with:
          name: server-bundle-${{ matrix.target }}
          path: |
            artifacts/server/*.tar.gz
            artifacts/server/*.zip
            artifacts/server/*.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Remove bundle isolation firewall rule
        if: always() && runner.os == 'Linux'
        run: sudo iptables -D OUTPUT -p tcp -m owner --uid-owner "$(id -u)" --dport 2375:2376 -j REJECT
      - name: Restore Windows runner container executables
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows-bundle-isolation.ps1 Remove

  server-bundle-postgres-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        ports: ["5432:5432"]
        env: { POSTGRES_DB: stash, POSTGRES_USER: stash, POSTGRES_PASSWORD: stash-ci-only }
        options: >-
          --health-cmd "pg_isready -U stash -d stash"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install --yes bubblewrap iptables strace
      - run: sudo iptables -I OUTPUT -p tcp -m owner --uid-owner "$(id -u)" --dport 2375:2376 -j REJECT
      - run: pnpm run package:server
        env: { STASH_VERSION: 0.1.0-ci-migration, STASH_SOURCE_COMMIT: "${{ github.sha }}" }
      - name: Migrate the extracted rich fixture in preserve and rotate modes
        run: |
          archive="$(find artifacts/server -maxdepth 1 -name 'stash-instance-*.tar.gz' -print -quit)"
          pnpm run smoke:server-bundle -- --archive "$archive" --postgres-url postgresql://stash:stash-ci-only@127.0.0.1:5432/stash
      - if: always()
        run: sudo iptables -D OUTPUT -p tcp -m owner --uid-owner "$(id -u)" --dport 2375:2376 -j REJECT

  mobile-native-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate the public Expo and EAS configuration
        working-directory: apps/mobile
        run: |
          pnpm exec expo config --type public --json > /tmp/stash-expo-config.json
          node -e 'const c=require("/tmp/stash-expo-config.json"); if(c.owner!=="djerayane"||c.slug!=="stash-capture"||c.ios.bundleIdentifier!=="app.stash.capture"||c.android.package!=="app.stash.capture"||c.extra?.eas?.projectId) process.exit(1)'
      - name: Reproducibly generate both native projects without credentials
        working-directory: apps/mobile
        run: |
          pnpm exec expo prebuild --clean --no-install --platform all
          find android ios -type f -print | LC_ALL=C sort > /tmp/native-first.files
          grep -Eq "applicationId ['\"]app.stash.capture['\"]" android/app/build.gradle
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = app.stash.capture' ios/StashCapture.xcodeproj/project.pbxproj
          rm -rf android ios
          pnpm exec expo prebuild --clean --no-install --platform all
          find android ios -type f -print | LC_ALL=C sort > /tmp/native-second.files
          diff -u /tmp/native-first.files /tmp/native-second.files

  release-preflight:
    if: inputs.release
    runs-on: ubuntu-latest
    environment: mobile-release
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      mobile-version: ${{ steps.mobile.outputs.version }}
      stable: ${{ steps.mobile.outputs.stable }}
      android-previous-version-code: ${{ steps.eas.outputs.android-previous }}
      ios-previous-build-number: ${{ steps.eas.outputs.ios-previous }}
      ios-signing-configured: ${{ steps.eas.outputs.ios-signing-configured }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Validate immutable release candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF" in refs/tags/v*) ;; *) echo "release requires refs/tags/v*" >&2; exit 1;; esac
          case "$GITHUB_REF_NAME" in *+*) echo "build metadata is not supported" >&2; exit 1;; esac
          version="${GITHUB_REF_NAME#v}"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+)(\.[0-9A-Za-z-]+)*)?$'
          [[ "$version" =~ $semver ]] || { echo "tag must be canonical SemVer" >&2; exit 1; }
          prerelease="${version#*-}"
          if [ "$prerelease" != "$version" ]; then
            IFS=. read -ra identifiers <<< "$prerelease"
            for identifier in "${identifiers[@]}"; do
              if [[ "$identifier" =~ ^[0-9]+$ && "$identifier" != 0 && "$identifier" == 0* ]]; then
                echo "tag must be canonical SemVer" >&2
                exit 1
              fi
            done
          fi
          tag_commit="$(git rev-parse "$GITHUB_REF^{commit}")"
          [ "$tag_commit" = "${{ github.sha }}" ] || { echo "tag does not resolve to github.sha" >&2; exit 1; }
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub Release already exists" >&2
            exit 1
          fi
          for asset in \
            "stash-instance-$version-linux-x64.tar.gz" "stash-instance-$version-linux-x64.tar.gz.sha256" \
            "stash-instance-$version-linux-arm64.tar.gz" "stash-instance-$version-linux-arm64.tar.gz.sha256" \
            "stash-instance-$version-darwin-x64.tar.gz" "stash-instance-$version-darwin-x64.tar.gz.sha256" \
            "stash-instance-$version-darwin-arm64.tar.gz" "stash-instance-$version-darwin-arm64.tar.gz.sha256" \
            "stash-instance-$version-win32-x64.zip" "stash-instance-$version-win32-x64.zip.sha256" SHA256SUMS; do
            if gh api -H 'Accept: application/vnd.github+json' "/repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq '.assets[].name' 2>/dev/null | grep -Fxq "$asset"; then
              echo "GitHub Release asset already exists: $asset" >&2
              exit 1
            fi
          done
          if package_tags="$(gh api --paginate /users/djerayane/packages/container/stash/versions --jq '.[].metadata.container.tags[]' 2>ghcr-error)"; then
            if grep -Fxq "$version" <<< "$package_tags"; then
              echo "ghcr.io/djerayane/stash:$version already exists" >&2
              exit 1
            fi
          elif ! grep -q 'HTTP 404' ghcr-error; then
            cat ghcr-error >&2
            exit 1
          fi
      - id: mobile
        name: Resolve the mobile marketing version
        run: node scripts/configure-mobile-release.mjs "$GITHUB_REF_NAME"
      - id: eas
        name: Validate EAS release identity and native version allocation baseline
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          IOS_SIGNING_CONFIGURED: ${{ vars.IOS_SIGNING_CONFIGURED }}
          MOBILE_VERSION: ${{ steps.mobile.outputs.version }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Mobile release unavailable: configure the EXPO_TOKEN GitHub Actions secret" >&2
            exit 1
          fi
          if ! [[ "$EAS_PROJECT_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$ ]]; then
            echo "Mobile release unavailable: configure the EAS_PROJECT_ID environment variable with the @djerayane/stash-capture project UUID" >&2
            exit 1
          fi
          builds="$(pnpm dlx eas-cli@16.4.0 build:list --platform all --app-version "$MOBILE_VERSION" --limit 1 --json --non-interactive)"
          [ "$(node -e 'const x=JSON.parse(process.argv[1]);process.stdout.write(String(x.length))' "$builds")" = 0 ] || {
            echo "EAS already associates a build with mobile version $MOBILE_VERSION" >&2
            exit 1
          }
          android="$(pnpm dlx eas-cli@16.4.0 build:version:get --platform android --profile production --json --non-interactive)"
          android_previous="$(node -e 'const x=JSON.parse(process.argv[1]);process.stdout.write(String(x.versionCode??x.android?.versionCode??0))' "$android")"
          ios_previous=0
          ios_signing_configured=false
          if [ "${{ steps.mobile.outputs.stable }}" = true ] && [ "$IOS_SIGNING_CONFIGURED" = true ] && [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            ios="$(pnpm dlx eas-cli@16.4.0 build:version:get --platform ios --profile production --json --non-interactive)"
            ios_previous="$(node -e 'const x=JSON.parse(process.argv[1]);process.stdout.write(String(x.buildNumber??x.ios?.buildNumber??0))' "$ios")"
            ios_signing_configured=true
          fi
          [[ "$android_previous" =~ ^[0-9]+$ && "$ios_previous" =~ ^[0-9]+$ ]] || { echo "EAS native versions must be numeric" >&2; exit 1; }
          {
            echo "android-previous=$android_previous"
            echo "ios-previous=$ios_previous"
            echo "ios-signing-configured=$ios_signing_configured"
          } >> "$GITHUB_OUTPUT"
