name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-quality:
    uses: ./.github/workflows/release-quality.yml
    permissions:
      contents: read
      packages: read
    with:
      release: true

  publish-container:
    needs: release-quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      source-commit: ${{ steps.metadata.outputs['source-commit'] }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: metadata
        name: Record immutable source metadata
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source-commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Refuse to overwrite an existing version tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.metadata.outputs.version }}"
          if package_tags="$(gh api --paginate /users/djerayane/packages/container/stash/versions --jq '.[].metadata.container.tags[]' 2>ghcr-error)"; then
            if grep -Fxq "$version" <<< "$package_tags"; then
              echo "ghcr.io/djerayane/stash:$version already exists" >&2
              exit 1
            fi
          elif ! grep -q 'HTTP 404' ghcr-error; then
            cat ghcr-error >&2
            exit 1
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - id: publish
        name: Publish the multi-architecture manifest
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/djerayane/stash:${{ steps.metadata.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.metadata.outputs.version }}
          provenance: true
      - name: Record published identities
        run: |
          echo "digest=${{ steps.publish.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "source-commit=${{ steps.metadata.outputs['source-commit'] }}" >> "$GITHUB_STEP_SUMMARY"

  publish-server-bundles:
    needs: release-quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse a publication collision immediately before upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub Release already exists" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: server-bundle-*
          path: artifacts
          merge-multiple: true
      - name: Verify tested archives and assemble the checksum index
        shell: bash
        run: |
          shopt -s nullglob
          checksums=(artifacts/*.sha256)
          test "${#checksums[@]}" -eq 5
          for checksum in "${checksums[@]}"; do (cd artifacts && sha256sum --check "$(basename "$checksum")"); done
          cat "${checksums[@]}" | LC_ALL=C sort -k2 > artifacts/SHA256SUMS
          printf 'source-commit=%s\nversion=%s\n' "$GITHUB_SHA" "${GITHUB_REF_NAME#v}" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish archives without overwriting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/*.tar.gz artifacts/*.zip artifacts/*.sha256 artifacts/SHA256SUMS \
            --verify-tag --title "Stash ${GITHUB_REF_NAME#v}" --generate-notes

  report-mobile-capabilities:
    needs: release-quality
    runs-on: ubuntu-latest
    steps:
      - name: Report store artifact eligibility
        run: |
          if [ "${{ needs.release-quality.outputs.stable }}" != true ]; then
            echo "Android store prerelease skipped: Play Store version requires a stable semantic version" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "iOS prerelease skipped: App Store version requires a stable semantic version" | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "${{ needs.release-quality.outputs.ios-signing-configured }}" != true ]; then
            echo "iOS release unavailable: configure the Apple distribution certificate and provisioning profile for app.stash.capture" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  publish-android-preview:
    needs: release-quality
    runs-on: ubuntu-latest
    environment: mobile-release
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm install --frozen-lockfile
      - id: version
        run: node scripts/configure-mobile-release.mjs "$GITHUB_REF_NAME"
      - name: Build the installable Android preview APK
        working-directory: apps/mobile
        run: |
          result="$(pnpm dlx eas-cli@16.4.0 build --platform android --profile preview --non-interactive --wait --json)" || {
            echo "Android release unavailable: configure the EAS Android keystore for app.stash.capture" >&2
            exit 1
          }
          url="$(node -e 'const x=JSON.parse(process.argv[1]);process.stdout.write(x[0]?.artifacts?.buildUrl??"")' "$result")"
          version_code="$(node -e 'const x=JSON.parse(process.argv[1]);process.stdout.write(String(x[0]?.appBuildVersion??""))' "$result")"
          test -n "$url" && [[ "$version_code" =~ ^[0-9]+$ ]]
          test "$version_code" -gt "${{ needs.release-quality.outputs.android-previous-version-code }}"
          curl --fail --show-error --location "$url" --output "stash-capture-${GITHUB_REF_NAME#v}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: stash-capture-${{ needs.release-quality.outputs.mobile-version }}-android-apk
          path: apps/mobile/stash-capture-*-android.apk
          if-no-files-found: error

  publish-android-store:
    if: needs.release-quality.outputs.stable == 'true'
    needs: release-quality
    runs-on: ubuntu-latest
    environment: mobile-release
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm install --frozen-lockfile
      - run: node scripts/configure-mobile-release.mjs "$GITHUB_REF_NAME"
      - name: Build the Android store AAB
        working-directory: apps/mobile
        run: |
          result="$(pnpm dlx eas-cli@16.4.0 build --platform android --profile production --non-interactive --wait --json)" || {
            echo "Android release unavailable: configure the EAS Android keystore for app.stash.capture" >&2
            exit 1
          }
          url="$(node -e 'const x=JSON.parse(process.argv[1]);process.stdout.write(x[0]?.artifacts?.buildUrl??"")' "$result")"
          version_code="$(node -e 'const x=JSON.parse(process.argv[1]);process.stdout.write(String(x[0]?.appBuildVersion??""))' "$result")"
          test -n "$url"
          echo "Verify the allocated Android versionCode: $version_code > ${{ needs.release-quality.outputs.android-previous-version-code }}"
          [[ "$version_code" =~ ^[0-9]+$ ]] && test "$version_code" -gt "${{ needs.release-quality.outputs.android-previous-version-code }}"
          curl --fail --show-error --location "$url" --output "stash-capture-${GITHUB_REF_NAME#v}-android.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: stash-capture-${{ needs.release-quality.outputs.mobile-version }}-android-aab
          path: apps/mobile/stash-capture-*-android.aab
          if-no-files-found: error

  publish-ios:
    if: needs.release-quality.outputs.stable == 'true' && needs.release-quality.outputs.ios-signing-configured == 'true'
    needs: release-quality
    runs-on: ubuntu-latest
    environment: mobile-release
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm install --frozen-lockfile
      - run: node scripts/configure-mobile-release.mjs "$GITHUB_REF_NAME"
      - name: Build the signed iOS IPA
        working-directory: apps/mobile
        run: |
          result="$(pnpm dlx eas-cli@16.4.0 build --platform ios --profile production --non-interactive --wait --json)" || {
            echo "iOS release unavailable: configure the Apple distribution certificate and provisioning profile for app.stash.capture" >&2
            exit 1
          }
          url="$(node -e 'const x=JSON.parse(process.argv[1]);process.stdout.write(x[0]?.artifacts?.buildUrl??"")' "$result")"
          build_number="$(node -e 'const x=JSON.parse(process.argv[1]);process.stdout.write(String(x[0]?.appBuildVersion??""))' "$result")"
          test -n "$url"
          echo "Verify the allocated iOS buildNumber: $build_number > ${{ needs.release-quality.outputs.ios-previous-build-number }}"
          [[ "$build_number" =~ ^[0-9]+$ ]] && test "$build_number" -gt "${{ needs.release-quality.outputs.ios-previous-build-number }}"
          curl --fail --show-error --location "$url" --output "stash-capture-${GITHUB_REF_NAME#v}-ios.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: stash-capture-${{ needs.release-quality.outputs.mobile-version }}-ios-ipa
          path: apps/mobile/stash-capture-*-ios.ipa
          if-no-files-found: error
