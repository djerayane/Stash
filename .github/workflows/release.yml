name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release-quality:
    uses: ./.github/workflows/release-quality.yml
    permissions:
      contents: read
      packages: read
    with:
      release: true

  publish-container:
    needs: release-quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      source-commit: ${{ steps.metadata.outputs['source-commit'] }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: metadata
        name: Record immutable source metadata
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source-commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - id: publish
        name: Publish the multi-architecture manifest
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/djerayane/stash:${{ steps.metadata.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.metadata.outputs.version }}
          provenance: true
      - name: Record published identities
        run: |
          echo "digest=${{ steps.publish.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "source-commit=${{ steps.metadata.outputs['source-commit'] }}" >> "$GITHUB_STEP_SUMMARY"
