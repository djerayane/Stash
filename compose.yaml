services:
  redis:
    image: redis:8-alpine
    profiles: ["redis"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: stash
      POSTGRES_USER: stash
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stash-development-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stash -d stash"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - stash-postgres:/var/lib/postgresql/data

  stash:
    image: ${STASH_IMAGE:-stash-local}
    build: .
    command:
      - sh
      - -c
      - |
        if [ "$$INSTANCE_ADMIN_TOKEN" = "stash-development-only-admin-token" ] ||
           [ "$$INSTANCE_MASTER_KEY" = "c3Rhc2gtbG9jYWwtZGV2ZWxvcG1lbnQta2V5LTAwMDA=" ] ||
           [ "$$PUBLIC_ORIGIN" = "http://localhost:3000" ] ||
           [ "$$POSTGRES_PASSWORD" = "stash-development-only" ]; then
          echo "WARNING: Stash is using localhost-only development credentials. Read README.md before exposing this Instance." >&2
        fi
        exec node dist/main.js
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_USER: stash
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stash-development-only}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: stash
      INSTANCE_ADMIN_TOKEN: ${INSTANCE_ADMIN_TOKEN:-stash-development-only-admin-token}
      INSTANCE_MASTER_KEY: ${INSTANCE_MASTER_KEY:-c3Rhc2gtbG9jYWwtZGV2ZWxvcG1lbnQta2V5LTAwMDA=}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      STASH_BIND_ADDRESS: ${STASH_BIND_ADDRESS:-127.0.0.1}
      REDIS_URL: ${REDIS_URL:-}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Stash}
      SMTP_URL: ${SMTP_URL:-}
      EMAIL_RECOVERY_FROM: ${EMAIL_RECOVERY_FROM:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      MCP_ENABLED: ${MCP_ENABLED:-false}
      OPEN_REGISTRATION: ${OPEN_REGISTRATION:-true}
      ATTACHMENT_STORAGE_PATH: /var/lib/stash/attachments
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PREFIX: ${S3_PREFIX:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      INSTANCE_BACKUP_PATH: /var/lib/stash/backups
      HOST: 0.0.0.0
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${STASH_BIND_ADDRESS:-127.0.0.1}:${STASH_PORT:-3000}:3000"
    volumes:
      - stash-attachments:/var/lib/stash/attachments
      - stash-backups:/var/lib/stash/backups
    restart: unless-stopped

volumes:
  stash-postgres:
  stash-attachments:
  stash-backups:
