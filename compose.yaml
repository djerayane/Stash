services:
  redis:
    image: redis:8-alpine
    profiles: ["redis"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: stash
      POSTGRES_USER: stash
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stash-development-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stash -d stash"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - stash-postgres:/var/lib/postgresql/data

  stash:
    build: .
    environment:
      DATABASE_URL: postgres://stash:${POSTGRES_PASSWORD:-stash-development-only}@postgres:5432/stash
      INSTANCE_ADMIN_TOKEN: ${INSTANCE_ADMIN_TOKEN:?Set INSTANCE_ADMIN_TOKEN to a strong secret}
      INSTANCE_MASTER_KEY: ${INSTANCE_MASTER_KEY:?Set INSTANCE_MASTER_KEY to a base64-encoded 32-byte key}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to the canonical HTTPS origin}
      REDIS_URL: ${REDIS_URL:-}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Stash}
      SMTP_URL: ${SMTP_URL:-}
      EMAIL_RECOVERY_FROM: ${EMAIL_RECOVERY_FROM:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      ATTACHMENT_STORAGE_PATH: /var/lib/stash/attachments
      INSTANCE_BACKUP_PATH: /var/lib/stash/backups
      HOST: 0.0.0.0
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${STASH_PORT:-3000}:3000"
    volumes:
      - stash-attachments:/var/lib/stash/attachments
      - stash-backups:/var/lib/stash/backups
    restart: unless-stopped

volumes:
  stash-postgres:
  stash-attachments:
  stash-backups:
